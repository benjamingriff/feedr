# Ships main to phones. Run it from the Actions tab ("Release" → Run workflow) when you want
# what's merged on your phone; merging alone only deploys the API.
#
# It computes the app's native fingerprint (a hash of everything native: Expo modules, app.json,
# the Expo SDK). If a finished production build already has that fingerprint, the JavaScript goes
# out as an over-the-air update in a minute and costs no build. If not, native code changed, so it
# makes a new build (one of the free plan's 15 iOS builds a month) and submits it to TestFlight.
#
# Fingerprints are only computed here, on Linux: another OS can hash differently and miss builds.
name: Release

on:
  workflow_dispatch:
    inputs:
      message:
        description: Update message (defaults to the last commit's subject)
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tag the release

jobs:
  release:
    name: Update or build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A build waits in the free plan's queue, then about 20 minutes to build.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # Installs eas-cli into the action's own folder; pnpm 11 refuses its build scripts there.
          packager: npm

      - id: ship
        name: Publish an update, or build for TestFlight
        working-directory: apps/mobile
        shell: bash # with pipefail, so a failed eas command stops the release
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ inputs.message }}
        run: |
          # eas-cli prints a notice before the JSON, so keep from the first "{" on.
          fingerprint=$(eas fingerprint:generate --platform ios --build-profile production --json --non-interactive | sed -n '/^{/,$p')
          hash=$(jq -er '.hash' <<<"$fingerprint")
          # If autolinking fails, @expo/fingerprint quietly leaves out every Expo module, and an
          # update could then reach a build without the native code it needs. Refuse.
          modules=$(jq '[.sources[] | select((.reasons // []) | index("expoAutolinkingIos"))] | length' <<<"$fingerprint")
          if [ "$modules" -eq 0 ]; then
            echo "::error::The fingerprint hashes no Expo native modules, so it can't be trusted."
            exit 1
          fi

          builds=$(eas build:list --platform ios --build-profile production --fingerprint-hash "$hash" --limit 20 --json --non-interactive)
          finished=$(jq '[.[] | select(.status == "FINISHED")] | length' <<<"$builds")
          active=$(jq '[.[] | select(.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS")] | length' <<<"$builds")

          if [ "$finished" -gt 0 ]; then
            eas update --channel production --environment production --platform ios \
              --message "${MESSAGE:-$(git log -1 --pretty=%s)}" --non-interactive
            echo "kind=Update" >> "$GITHUB_OUTPUT"
            echo "Published an update for builds with fingerprint \`$hash\`." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$active" -gt 0 ]; then
            echo "::error::A build for fingerprint $hash is already running. Run Release again once it finishes."
            exit 1
          else
            # --wait also waits for the TestFlight submission, and exits non-zero if either fails.
            status=0
            builds=$(eas build --platform ios --profile production --auto-submit --non-interactive --wait --json) || status=$?
            build_id=$(jq -r '.[0].id // empty' <<<"$builds" 2>/dev/null || true)
            echo "kind=TestFlight build" >> "$GITHUB_OUTPUT"
            # The status in that JSON can be from before the wait, so ask EAS for the build as it is now.
            finished=false
            if [ -n "$build_id" ]; then
              current=$(eas build:view "$build_id" --json 2>/dev/null | jq -r '.status // empty' || true)
              [ "$current" = FINISHED ] && finished=true
            fi
            if [ "$status" -eq 0 ]; then
              echo "Built fingerprint \`$hash\` (build \`$build_id\`) and submitted it to TestFlight." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$finished" = true ]; then
              # Rerunning Release would now find the finished build and publish an update instead.
              {
                echo "Build \`$build_id\` finished but its TestFlight submission failed. Don't rerun Release."
                echo "Submit the build again:"
                echo
                echo "    cd apps/mobile && npx eas-cli@latest submit --platform ios --profile production --id $build_id"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Build $build_id finished but its submission failed. See the summary for the command to resubmit."
            fi
            exit "$status"
          fi

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.ship.outputs.kind }}
        run: |
          tag="release-$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag ($KIND)" --generate-notes
